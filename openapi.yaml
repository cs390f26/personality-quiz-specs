openapi: 3.0.3

info:
  title: Personality Quiz API
  description: |
    HTTP API for a fixed multiple-choice personality quiz.

    The quiz questions and answer choices are predefined and stored in MySQL.
    Each answer contributes one point toward a personality type. When the quiz
    is submitted, the API determines the personality type with the highest
    score, stores the completed result, and returns that result to the client.

    The API also provides cumulative statistics across all completed quiz
    attempts.
  version: 1.0.0

paths:
  /questions:
    get:
      summary: Get all quiz questions
      description: |
        Returns all questions in the fixed personality quiz along with their
        answer choices. Questions are returned in question ID order.

        The personality type associated with each answer is not included in
        this response so that scoring details remain on the server.
      operationId: listQuestions
      responses:
        '200':
          description: All quiz questions and answer choices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListResponse'
              example:
                questions:
                  - questionId: 1
                    questionText: Which activity sounds most appealing?
                    answers:
                      - answerId: 1
                        answerText: Trying something exciting and spontaneous
                      - answerId: 2
                        answerText: Planning and completing an organized project
                      - answerId: 3
                        answerText: Learning how something complex works
                      - answerId: 4
                        answerText: Spending meaningful time with other people

  /questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      summary: Get a question
      description: |
        Returns one quiz question and its answer choices.
      operationId: getQuestion
      responses:
        '200':
          description: Question found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
              example:
                questionId: 1
                questionText: Which activity sounds most appealing?
                answers:
                  - answerId: 1
                    answerText: Trying something exciting and spontaneous
                  - answerId: 2
                    answerText: Planning and completing an organized project
                  - answerId: 3
                    answerText: Learning how something complex works
                  - answerId: 4
                    answerText: Spending meaningful time with other people
        '404':
          $ref: '#/components/responses/NotFound'

  /quiz-results:
    post:
      summary: Submit a completed quiz
      description: |
        Submits the user's name and selected answer IDs for a completed quiz.

        The server looks up the personality type associated with each selected
        answer, totals the number of selections for each personality type, and
        chooses the personality type with the highest total as the final result.
        The completed result is stored in the quiz_results table.

        The client should submit exactly one answer for every quiz question.
        Tie-breaking behavior should be defined by the application before
        implementation if two or more personality types receive the same score.
      operationId: submitQuiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuizRequest'
            example:
              personName: Jenny
              selectedAnswers:
                - questionId: 1
                  answerId: 3
                - questionId: 2
                  answerId: 7
                - questionId: 3
                  answerId: 11
                - questionId: 4
                  answerId: 15
                - questionId: 5
                  answerId: 19
      responses:
        '201':
          description: Quiz completed and result stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResult'
              example:
                resultId: 1
                personName: Jenny
                personality:
                  personalityId: 3
                  personalityType: Green
                  description: Analytical, curious, and independent
                completedDate: '2026-09-14'
        '400':
          $ref: '#/components/responses/BadRequest'

  /quiz-results/{resultId}:
    parameters:
      - $ref: '#/components/parameters/ResultId'
    get:
      summary: Get a completed quiz result
      description: |
        Returns a previously stored quiz result by result ID.
      operationId: getQuizResult
      responses:
        '200':
          description: Quiz result found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResult'
              example:
                resultId: 1
                personName: Jenny
                personality:
                  personalityId: 3
                  personalityType: Green
                  description: Analytical, curious, and independent
                completedDate: '2026-09-14'
        '404':
          $ref: '#/components/responses/NotFound'

  /statistics:
    get:
      summary: Get cumulative quiz statistics
      description: |
        Returns the total number of completed quizzes and the number of results
        for each personality type. Statistics are calculated from quiz_results.
      operationId: getStatistics
      responses:
        '200':
          description: Cumulative quiz statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
              example:
                totalCompleted: 5
                personalityTypes:
                  - personalityId: 1
                    personalityType: Orange
                    count: 1
                    percentage: 20.0
                  - personalityId: 2
                    personalityType: Gold
                    count: 1
                    percentage: 20.0
                  - personalityId: 3
                    personalityType: Green
                    count: 2
                    percentage: 40.0
                  - personalityId: 4
                    personalityType: Blue
                    count: 1
                    percentage: 20.0

  /health:
    get:
      summary: Health check
      description: |
        Returns whether the service can accept traffic, including a check that
        the MySQL database is reachable.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unavailable

components:
  parameters:
    QuestionId:
      name: questionId
      in: path
      required: true
      description: Unique identifier for a quiz question
      schema:
        type: integer
        minimum: 1
      example: 1

    ResultId:
      name: resultId
      in: path
      required: true
      description: Unique identifier for a completed quiz result
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingName:
              summary: Missing user name
              value:
                error:
                  code: BAD_REQUEST
                  message: personName is required
            missingAnswer:
              summary: Quiz is incomplete
              value:
                error:
                  code: BAD_REQUEST
                  message: One answer must be submitted for every quiz question
            invalidAnswer:
              summary: Answer does not belong to the question
              value:
                error:
                  code: BAD_REQUEST
                  message: The selected answer is not valid for the specified question

    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Requested resource not found

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable

    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - NOT_FOUND
        message:
          type: string
          description: Human-readable explanation of the error

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    AnswerChoice:
      type: object
      required:
        - answerId
        - answerText
      properties:
        answerId:
          type: integer
          minimum: 1
          description: Unique identifier for the answer choice
          example: 1
        answerText:
          type: string
          minLength: 1
          description: Answer text displayed to the user
          example: Trying something exciting and spontaneous

    Question:
      type: object
      required:
        - questionId
        - questionText
        - answers
      properties:
        questionId:
          type: integer
          minimum: 1
          description: Unique identifier for the question
          example: 1
        questionText:
          type: string
          minLength: 1
          description: Question text displayed to the user
          example: Which activity sounds most appealing?
        answers:
          type: array
          minItems: 2
          description: Answer choices for this question
          items:
            $ref: '#/components/schemas/AnswerChoice'

    QuestionListResponse:
      type: object
      required:
        - questions
      properties:
        questions:
          type: array
          description: All questions in the fixed quiz
          items:
            $ref: '#/components/schemas/Question'

    SelectedAnswer:
      type: object
      required:
        - questionId
        - answerId
      properties:
        questionId:
          type: integer
          minimum: 1
          description: Question being answered
          example: 1
        answerId:
          type: integer
          minimum: 1
          description: Selected answer for the question
          example: 3

    SubmitQuizRequest:
      type: object
      required:
        - personName
        - selectedAnswers
      properties:
        personName:
          type: string
          minLength: 1
          maxLength: 100
          description: Name entered by the user before taking the quiz
          example: Jenny
        selectedAnswers:
          type: array
          minItems: 1
          description: |
            One selected answer for each quiz question. The server validates
            that each answer belongs to its supplied question and that the quiz
            is complete.
          items:
            $ref: '#/components/schemas/SelectedAnswer'

    PersonalityType:
      type: object
      required:
        - personalityId
        - personalityType
        - description
      properties:
        personalityId:
          type: integer
          minimum: 1
          description: Unique identifier for the personality type
          example: 3
        personalityType:
          type: string
          description: Name of the personality type
          example: Green
        description:
          type: string
          description: Description of the personality type
          example: Analytical, curious, and independent

    QuizResult:
      type: object
      required:
        - resultId
        - personName
        - personality
        - completedDate
      properties:
        resultId:
          type: integer
          minimum: 1
          description: Unique identifier for the completed quiz result
          example: 1
        personName:
          type: string
          description: Name entered by the quiz taker
          example: Jenny
        personality:
          $ref: '#/components/schemas/PersonalityType'
        completedDate:
          type: string
          format: date
          description: Date the quiz was completed
          example: '2026-09-14'

    PersonalityStatistic:
      type: object
      required:
        - personalityId
        - personalityType
        - count
        - percentage
      properties:
        personalityId:
          type: integer
          minimum: 1
          example: 3
        personalityType:
          type: string
          example: Green
        count:
          type: integer
          minimum: 0
          description: Number of completed quizzes with this result
          example: 2
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of all completed quizzes with this result
          example: 40.0

    StatisticsResponse:
      type: object
      required:
        - totalCompleted
        - personalityTypes
      properties:
        totalCompleted:
          type: integer
          minimum: 0
          description: Total number of completed quiz attempts
          example: 5
        personalityTypes:
          type: array
          description: Cumulative results grouped by personality type
          items:
            $ref: '#/components/schemas/PersonalityStatistic'
